<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repertoire Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   Design tokens — layout-spec.md §1
   =========================================================== */
:root{
  color-scheme:light;
  --bg:#f0f0ef;
  --card:#ffffff;
  --ink:#2c3d4b;
  --body:#62788a;
  --mut:#9aabb7;
  --acc:#4da3f5;
  --acc-hi:#2f8fe6;
  --badge:#dceeff;
  --badge-ink:#2f88d8;
  --field:#f2f7fc;
  --hair:#e6ebef;
  --bord:#dbe3e8;
  --sq-l:#fafcff;
  --sq-d:#a8d4fb;
  --edge:#63b0f5;
  --dim:#a9d0f5;
  --err:#d94b4b;
  --err-bg:#fdecec;
  --ev-d:#16232e;
  --ev-l:#f4f8fb;
  --due:#d08a30;
  --due-bg:#fbf0de;
  --mark:rgba(77,163,245,.42);
  --mark-2:rgba(47,136,216,.62);
  --dotmark:rgba(44,61,75,.24);
  --shadow:0 1px 3px rgba(44,61,75,.07);
  --lift:0 8px 10px rgba(23,34,46,.35);
  --ui:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1b26;
  --card:#17252f;
  --ink:#ffffff;
  --body:#c2d2dd;
  --mut:#7c93a3;
  --acc:#55aaf8;
  --acc-hi:#7bbefa;
  --badge:#1d3a52;
  --badge-ink:#8fc9fb;
  --field:#132029;
  --hair:#223341;
  --bord:#2a3d4d;
  --sq-l:#c3d6e6;
  --sq-d:#5b87ad;
  --edge:#55aaf8;
  --dim:#3d6a8f;
  --err:#e5716f;
  --err-bg:#3b2226;
  --ev-d:#050c12;
  --ev-l:#f4f8fb;
  --due:#e7ab55;
  --due-bg:#372a17;
  --mark:rgba(85,170,248,.42);
  --mark-2:rgba(143,201,251,.6);
  --dotmark:rgba(15,27,38,.34);
  --shadow:0 1px 3px rgba(0,0,0,.32);
  --lift:0 10px 14px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.55;
  -webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700}
p{margin:0}
.wrap{max-width:1320px;margin:0 auto;padding:22px 40px 64px}

/* ===========================================================
   App header — layout-spec.md §3
   =========================================================== */
.top{position:relative;text-align:center;min-height:50px;padding:2px 46px 0}
.top b{display:block;font:700 21px/1.3 var(--ui);color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{display:block;font:400 14px/1.4 var(--ui);color:var(--mut)}
.back{position:absolute;top:-4px;left:-6px;width:38px;height:38px;border:0;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font:400 24px/1 var(--ui);color:var(--body);
  border-radius:11px;padding:0}
.moon{position:absolute;top:-2px;right:-6px;width:38px;height:38px;border:0;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;color:var(--body);
  border-radius:11px;padding:0}
.back:hover,.moon:hover{color:var(--ink);background:var(--card)}

/* ===========================================================
   Segmented controls
   =========================================================== */
.subbar{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;margin:22px 0 0}
.seg{display:flex;gap:4px;background:var(--card);padding:5px;border-radius:14px;box-shadow:var(--shadow)}
.seg button{background:none;border:0;border-radius:10px;cursor:pointer;
  font:500 16px/1 var(--ui);color:var(--body);padding:13px 26px;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--acc);color:#fff;font-weight:600}
.seg button:not([aria-selected="true"]):hover{color:var(--ink)}
.seg.small button{padding:13px 22px}
.sideline{display:flex;align-items:center;gap:20px}
.count{font:400 17px/1 var(--ui);color:var(--mut);white-space:nowrap}
.count b{font-weight:600;color:var(--acc)}

/* ===========================================================
   Buttons
   =========================================================== */
.btn{background:none;border:1px solid var(--bord);color:var(--ink);
  font:500 17px/1 var(--ui);padding:16px 26px;border-radius:11px;cursor:pointer;
  white-space:nowrap;flex:none}
.btn:hover{border-color:var(--body)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;padding:17px 30px}
.btn.primary:hover{background:var(--acc-hi);border-color:var(--acc-hi)}
.btn.strong{border-color:var(--body);font-weight:600}
.btn.quiet{border-color:transparent;color:var(--body);padding:16px 10px}
.btn.quiet:hover{color:var(--ink);border-color:transparent}
.btn:disabled{color:var(--mut);cursor:default}
.btn:disabled:hover{border-color:var(--bord)}
.btn:focus-visible,.seg button:focus-visible,.back:focus-visible,.moon:focus-visible,
input:focus-visible,textarea:focus-visible,select:focus-visible,.lsq:focus-visible,
.oc:focus-visible,.sheet .c.go:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:7px}

/* ===========================================================
   Drill stage — layout-spec.md §4 (L4/L5/L7/L8)
   =========================================================== */
.stage{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;
  column-gap:24px;margin:22px 0 0;align-items:start}
.boardcard{grid-column:1;grid-row:1;width:min(650px,calc(100vh - 210px));padding:22px;
  background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.tail{grid-column:1;grid-row:2;min-width:0}
.bwrap{display:grid;grid-template-columns:10px 18px minmax(0,1fr);column-gap:7px;align-items:start}
.evalcol{grid-column:1;grid-row:1;align-self:stretch;display:flex}
.evalbar{flex:1;border-radius:5px;overflow:hidden;background:var(--ev-d);position:relative}
.evalbar i{position:absolute;left:0;right:0;bottom:0;height:50%;background:var(--ev-l);
  transition:height .28s cubic-bezier(.3,.7,.3,1)}
.ranks{grid-column:2;grid-row:1;align-self:stretch;display:flex;flex-direction:column}
.ranks span{flex:1;display:flex;align-items:center;justify-content:center;
  font:400 13px/1 var(--ui);color:var(--mut)}
.files{grid-column:3;grid-row:2;display:flex;margin-top:9px}
.files span{flex:1;text-align:center;font:500 13px/1 var(--ui);color:var(--mut)}
.evnum{grid-column:3;grid-row:3;font:400 12px/1 var(--mono);color:var(--mut);margin-top:12px}

.board{grid-column:3;grid-row:1;position:relative;aspect-ratio:1;
  display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  border:2px solid var(--edge);border-radius:3px;overflow:hidden;
  touch-action:none;user-select:none;background:var(--sq-l)}
.sq{position:relative}
.sq.d{background:var(--sq-d)}
.sq.mine{cursor:grab}
.board.dragging,.board.dragging .sq.mine{cursor:grabbing}
.sq::before{content:'';position:absolute;inset:0;background:var(--mark);opacity:0;transition:opacity .1s}
.sq.last::before{opacity:1}
.sq.sel::before{background:var(--mark-2);opacity:1}
.sq.bad::before{background:var(--err);opacity:.55}
.sq.chk::before{opacity:1;background:radial-gradient(circle,rgba(217,75,75,.8) 14%,rgba(217,75,75,0) 72%)}
.dot{position:absolute;left:50%;top:50%;width:24%;height:24%;margin:-12% 0 0 -12%;border-radius:50%;
  background:var(--dotmark);opacity:0;pointer-events:none;z-index:1}
.sq.tgt .dot{opacity:1}
.sq.tgt.occ .dot{width:100%;height:100%;margin:-50% 0 0 -50%;border-radius:0;background:none;
  box-shadow:inset 0 0 0 6px var(--dotmark)}
.pc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;
  transition:transform .17s cubic-bezier(.25,.8,.35,1)}
.pc.off{display:none}
.pc.lift{opacity:.25}
.ghost{position:fixed;z-index:99;will-change:transform,left,top;pointer-events:none;
  transform:translate(-50%,-50%) scale(1.06);filter:drop-shadow(var(--lift))}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.arrows polygon{stroke-width:0}
.arrows .ok{stroke:var(--acc);fill:var(--acc)}
.arrows .no{stroke:var(--err);fill:var(--err)}

/* progress dots */
.strip{display:flex;flex-wrap:wrap;gap:4px;margin-top:20px}
.lsq{width:14px;height:14px;border:0;padding:0;border-radius:4px;background:var(--bord);cursor:pointer}
.lsq.seen{background:var(--dim)}
.lsq.mast{background:var(--acc)}
.lsq.due{background:var(--due)}
.lsq.here{background:transparent;box-shadow:inset 0 0 0 2px var(--body)}
.striplbl{margin-top:13px;font:400 15px/1.4 var(--ui);color:var(--body)}

/* ===========================================================
   Drill panel
   =========================================================== */
.panel{grid-column:2;grid-row:1/3;min-width:0;min-height:608px;padding:26px;background:var(--card);
  border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px}
.meta .ph{font:500 14px/1 var(--ui);color:var(--badge-ink);background:var(--badge);
  padding:8px 13px;border-radius:9px;white-space:nowrap}
.meta .ph.mastered{color:#fff;background:var(--acc)}
.meta .ph.wrong{color:var(--err);background:var(--err-bg)}
.meta .ph.due{color:var(--due);background:var(--due-bg)}
.meta .ct{font:400 14px/1 var(--ui);color:var(--mut);white-space:nowrap}
.say{font:600 26px/1.3 var(--ui);color:var(--ink);margin:24px 0 0;text-wrap:pretty;min-height:34px}
.say.err{color:var(--err)}
.say .soft{color:var(--mut);font-weight:500}
.say.blank{height:34px;width:58%;border-radius:8px;background:var(--field)}
.fb{font:400 16px/1.5 var(--ui);color:var(--body);margin:12px 0 0;text-wrap:pretty}
.fb:empty{display:none}
.fb.soft{color:var(--mut)}
.fb b{font:500 15px/1 var(--mono);color:var(--ink)}
.fb.ok b{color:var(--ink)}
.note{font:400 15px/1.5 var(--ui);color:var(--badge-ink);background:var(--badge);
  border-radius:10px;padding:12px 15px;margin:16px 0 0}

/* move list — layout-spec.md §3 */
.sheet{position:relative;margin:30px 0 0;display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr);
  gap:10px 12px;align-content:start;max-height:268px;overflow:auto}
.sheet .n{font:400 14px/26px var(--mono);color:var(--mut)}
.sheet .c{height:26px;border-radius:6px;background:var(--field);border:0;width:100%;display:block;
  padding:0 10px;text-align:left;font:500 15px/26px var(--mono);color:var(--ink)}
.sheet .c.go{cursor:pointer}
.sheet .c.go:hover{background:var(--badge)}
.sheet .c.mine{background:var(--badge)}
.sheet .c.at{background:var(--acc);color:#fff}
.sheet .c.hid{color:transparent}
.sheet .c.now{background:var(--field);color:var(--mut)}
.sheet .c.bad{background:var(--err-bg);color:var(--err)}
.sheet .c.pad{background:none}

.grow{flex:1}
.rule{height:1px;background:var(--hair);margin:26px 0 22px}
.acts{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ext{margin:22px 0 0;font:500 17px/1 var(--ui)}
.ext a{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.ext a:hover{color:var(--acc)}
.ext span{font-size:13px;color:var(--body)}
.pips{display:flex;align-items:center;gap:11px;margin:26px 0 0}
.pips .dots{display:flex;gap:4px}
.pip{width:13px;height:13px;border-radius:4px;background:var(--bord)}
.pip.on{background:var(--dim)}
.pips .lbl{font:400 15px/1 var(--ui);color:var(--body)}
.keys{font:400 13px/1 var(--mono);color:var(--mut);margin:14px 0 0;letter-spacing:.02em}

/* ===========================================================
   Landing / repertoire grid — L1
   =========================================================== */
.lede{max-width:620px;margin:44px 0 0}
.lede h1{font:700 46px/1.14 var(--ui);color:var(--ink);letter-spacing:-1.1px;text-wrap:pretty}
.lede p{font:400 17px/1.55 var(--ui);color:var(--body);margin:22px 0 0;text-wrap:pretty}
.sec{font:500 14px/1 var(--ui);color:var(--mut);margin:38px 0 16px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.oc{display:flex;gap:20px;padding:20px;background:var(--card);border:0;border-radius:14px;
  box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.oc:hover .oc-cta{color:var(--acc)}
.oc:hover{box-shadow:0 1px 3px rgba(44,61,75,.07),0 0 0 1px var(--acc)}
.mini{width:156px;height:156px;flex:none;display:grid;grid-template-columns:repeat(8,1fr);
  grid-template-rows:repeat(8,1fr);border:2px solid var(--edge);border-radius:3px;overflow:hidden;
  background:var(--sq-l)}
.mini i{position:relative}
.mini i.d{background:var(--sq-d)}
.mini svg{position:absolute;inset:0;width:100%;height:100%}
.oc-body{flex:1;min-width:0;display:flex;flex-direction:column}
.oc-body h3{font:600 22px/1.2 var(--ui);color:var(--ink)}
.oc-body p{font:400 14px/1.5 var(--ui);color:var(--body);margin:9px 0 0;text-wrap:pretty}
.oc-side{display:inline-block;align-self:flex-start;font:500 13px/1 var(--ui);color:var(--badge-ink);
  background:var(--badge);padding:7px 11px;border-radius:8px;margin:13px 0 0}
.oc-foot{margin-top:auto;padding-top:14px}
.oc-n{display:block;text-align:right;font:400 14px/1 var(--ui);color:var(--mut);margin:0 0 10px}
.oc-bar{height:1px;background:var(--hair);display:flex;overflow:hidden}
.oc-bar i{display:block;height:100%}
.oc-bar i.m{background:var(--acc)}
.oc-bar i.s{background:var(--dim)}
.oc-cta{display:block;font:500 15px/1 var(--ui);color:var(--body);margin:13px 0 0}

/* ===========================================================
   Your repertoires — L2
   =========================================================== */
.reps{display:flex;flex-direction:column;gap:16px}
.rep{display:flex;align-items:center;gap:18px;padding:18px 22px;background:var(--card);
  border-radius:14px;box-shadow:var(--shadow);flex-wrap:wrap}
.rep .icon{width:48px;height:48px;flex:none;border-radius:50%;background:var(--badge);
  position:relative;overflow:hidden}
.rep .icon .pc{padding:8px}
.rep .head{flex:1;min-width:0;display:flex;align-items:center;gap:18px}
.rep .foot{display:flex;align-items:center;gap:8px}
.rep .grow{flex:1;min-width:0}
.rep .nm{font:600 20px/1.25 var(--ui);color:var(--ink)}
.rep .sub{font:400 14px/1.4 var(--ui);color:var(--mut);margin:5px 0 0}
.rep .btn.primary{padding:15px 30px;font-size:16px}
.rep .btn.quiet{font-size:16px;padding:15px 8px}

/* ===========================================================
   PGN import — L3
   =========================================================== */
.form{margin:34px 0 0;padding:34px 38px;background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.form .sec{margin:0}
.form h2{font:600 26px/1.25 var(--ui);color:var(--ink);margin:12px 0 0}
.row{display:flex;gap:24px;margin:26px 0 0;flex-wrap:wrap}
.field{flex:1;min-width:180px}
.field.narrow{flex:none;width:240px}
.field label{display:block;font:400 14px/1 var(--ui);color:var(--body);margin:0 0 9px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--field);color:var(--ink);
  border:1px solid transparent;border-radius:11px;padding:18px;font:400 17px/1 var(--ui);
  -webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),
  linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(100% - 22px) 25px,calc(100% - 16px) 25px;
  background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:44px;cursor:pointer}
textarea{font:400 15px/1.6 var(--mono);min-height:200px;padding:20px;resize:vertical;white-space:pre}
input::placeholder,textarea::placeholder{color:var(--mut)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc)}
.drop{margin:24px 0 0;border:2px dashed var(--bord);border-radius:13px;padding:44px;
  display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.drop.over{border-color:var(--acc);background:var(--field)}
.drop .btn{background:var(--card);font-size:18px;padding:17px 30px}
.drop .line{font:400 15px/1.5 var(--ui);color:var(--body)}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);
  font:500 15px/1 var(--ui);text-decoration:underline}
.hint{font:400 14px/1.5 var(--ui);color:var(--mut);margin:9px 0 0}
.submit{display:flex;justify-content:flex-end;margin:22px 0 0}
.banner{margin:24px 0 0;padding:20px 22px;background:var(--field);border-radius:13px}
.banner h3{font:600 18px/1.3 var(--ui);color:var(--ink)}
.banner.warn h3{color:var(--err)}
.banner p{font:400 15px/1.5 var(--ui);color:var(--body);margin:6px 0 0}
.banner ul{margin:9px 0 0;padding-left:18px;font:400 13px/1.7 var(--mono);color:var(--mut)}
.banner textarea{background:var(--card);min-height:150px}
.bar{height:6px;background:var(--bord);border-radius:3px;overflow:hidden;margin:12px 0 0}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s linear}

/* ===========================================================
   All lines — L6
   =========================================================== */
.table{margin:24px 0 0;background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.thead,.lrow{display:flex;align-items:center;gap:20px;padding:17px 26px}
.thead{padding:16px 26px;border-bottom:1px solid var(--hair)}
.thead span{font:500 13px/1 var(--ui);color:var(--mut)}
.lrow{border-bottom:1px solid var(--hair);width:100%;background:none;border-left:0;border-right:0;
  border-top:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--field)}
.col-n{width:34px;flex:none;font:400 15px/1 var(--mono);color:var(--mut)}
.col-m{flex:1;min-width:0;font:500 16px/1.4 var(--mono);color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-s{width:150px;flex:none;display:flex;align-items:center;gap:9px}
.col-s .dt{width:11px;height:11px;border-radius:50%;background:var(--bord);flex:none}
.col-s .dt.mast{background:var(--acc)}
.col-s .dt.prog{background:var(--dim)}
.col-s .dt.due{background:var(--due)}
.col-s span{font:400 15px/1 var(--ui);color:var(--body);white-space:nowrap}
.col-s.untouched span{color:var(--mut)}
.col-t{width:140px;flex:none;text-align:right;font:400 15px/1 var(--ui);color:var(--mut)}
.foot{font:400 15px/1 var(--ui);color:var(--body);margin:20px 0 0}

/* ===========================================================
   Cards, empty state — L9
   =========================================================== */
.card{margin:22px 0 0;padding:34px 38px;background:var(--card);border-radius:16px;
  box-shadow:var(--shadow);max-width:620px}
.card h2{font:600 26px/1.25 var(--ui);color:var(--ink)}
.card p{font:400 17px/1.55 var(--ui);color:var(--body);margin:12px 0 26px;text-wrap:pretty}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:640px;text-align:center}
.empty .deco{width:200px;height:200px;border:2px solid var(--bord);border-radius:4px;opacity:.7;
  background-color:var(--field);
  background-image:linear-gradient(45deg,var(--bord) 25%,transparent 25%,transparent 75%,var(--bord) 75%),
    linear-gradient(45deg,var(--bord) 25%,transparent 25%,transparent 75%,var(--bord) 75%);
  background-size:50px 50px;background-position:0 0,25px 25px}
.empty h2{font:700 34px/1.2 var(--ui);color:var(--ink);margin:36px 0 0;letter-spacing:-.5px}
.empty p{max-width:480px;font:400 17px/1.55 var(--ui);color:var(--body);margin:16px 0 0;text-wrap:pretty}
.empty .acts{justify-content:center;margin:32px 0 0}
.empty .tail{font:400 15px/1 var(--ui);color:var(--mut);margin:26px 0 0}

/* ===========================================================
   Tablet
   =========================================================== */
@media(max-width:1080px){
  .wrap{padding:22px 24px 56px}
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;justify-items:center}
  .boardcard{grid-column:1;grid-row:1;width:100%;max-width:650px}
