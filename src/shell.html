<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repertoire Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#EDF2F7;
  --card:#FFFFFF;
  --sunk:#F4F7FA;
  --line:#E2E9F0;
  --line-2:#D2DCE6;
  --tx:#17222E;
  --mut:#657588;
  --fnt:#95A3B3;
  --acc:#2E9BE8;
  --acc-tx:#1A7CC0;
  --acc-soft:#E6F2FC;
  --sq-l:#F5F7F9;
  --sq-d:#D2E6F8;
  --mark:rgba(46,155,232,.30);
  --mark-2:rgba(46,155,232,.48);
  --bad:rgba(230,83,64,.38);
  --warn:#D8503C;
  --ok:#2E9BE8;
  --shadow:0 1px 2px rgba(23,34,46,.05),0 6px 18px -8px rgba(23,34,46,.18);
  --ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1720;
  --card:#18222D;
  --sunk:#131C25;
  --line:#24313E;
  --line-2:#2E3D4C;
  --tx:#E8EEF4;
  --mut:#93A3B4;
  --fnt:#6B7C8E;
  --acc:#3FA7F0;
  --acc-tx:#7CC4F6;
  --acc-soft:#15293A;
  --sq-l:#E4E9ED;
  --sq-d:#7BA2C2;
  --mark:rgba(63,167,240,.42);
  --mark-2:rgba(63,167,240,.62);
  --bad:rgba(230,83,64,.5);
  --warn:#F08A76;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--ui);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:16px 22px 60px}

/* header */
.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:56px;margin-bottom:18px}
.ico{width:40px;height:40px;border-radius:12px;border:1px solid transparent;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--tx)}
.ico:hover{background:var(--card);border-color:var(--line)}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.title{text-align:center;min-width:0}
.title b{display:block;font-weight:700;font-size:16.5px;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{display:block;font-size:12px;color:var(--fnt);font-weight:500}
.subbar{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.seg button{background:none;border:0;padding:8px 18px;border-radius:9px;cursor:pointer;color:var(--mut);
  font-size:14px;font-weight:600;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--acc);color:#fff}
.seg button:not([aria-selected="true"]):hover{color:var(--tx)}
.seg.mini button{padding:6px 12px;font-size:13px;font-weight:600}
.count{font-size:13px;color:var(--mut);font-weight:500;white-space:nowrap}
.count b{color:var(--acc-tx);font-weight:700}

/* buttons */
.btn{background:var(--card);border:1px solid var(--line-2);color:var(--tx);padding:11px 18px;border-radius:11px;
  cursor:pointer;font-size:14.5px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:#2589d1;border-color:#2589d1}
.btn.quiet{background:none;border-color:transparent;color:var(--mut);padding:11px 10px}
.btn.quiet:hover{color:var(--tx)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.seg button:focus-visible,.ico:focus-visible,input:focus-visible,textarea:focus-visible,
select:focus-visible,.lsq:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 368px;gap:26px;align-items:start}
.boardcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.bwrap{display:grid;grid-template-columns:18px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 18px;gap:6px;
  width:min(100%,calc(100vh - 290px));margin:0 auto}
.ranks{display:flex;flex-direction:column;justify-content:space-around;align-items:center}
.files{grid-column:2;display:flex;justify-content:space-around;align-items:center}
.ranks span,.files span{font-size:11.5px;font-weight:600;color:var(--fnt);font-family:var(--mono)}
.board{position:relative;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  border:2px solid var(--acc);border-radius:8px;overflow:hidden;touch-action:none;user-select:none;
  background:var(--sq-l)}
.sq{position:relative}
.sq.mine{cursor:grab}
.board.dragging,.board.dragging .sq.mine{cursor:grabbing}
.sq.d{background:var(--sq-d)}
.sq::before{content:'';position:absolute;inset:0;background:var(--mark);opacity:0;transition:opacity .1s}
.sq.last::before{opacity:1}
.sq.sel::before{background:var(--mark-2);opacity:1}
.sq.bad::before{background:var(--bad);opacity:1}
.sq.chk::before{opacity:1;background:radial-gradient(circle,rgba(230,83,64,.8) 14%,rgba(230,83,64,0) 72%)}
.dot{position:absolute;left:50%;top:50%;width:24%;height:24%;margin:-12% 0 0 -12%;border-radius:50%;
  background:rgba(23,34,46,.22);opacity:0;pointer-events:none;z-index:1}
.sq.tgt .dot{opacity:1}
.sq.tgt.occ .dot{width:100%;height:100%;margin:-50% 0 0 -50%;border-radius:0;background:none;
  box-shadow:inset 0 0 0 6px rgba(23,34,46,.18)}
.pc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;
  transition:transform .17s cubic-bezier(.25,.8,.35,1)}
.pc.off{display:none}
.pc.lift{opacity:.25}
.ghost{position:fixed;z-index:99;will-change:transform,left,top;pointer-events:none;transform:translate(-50%,-50%) scale(1.06);
  filter:drop-shadow(0 8px 10px rgba(23,34,46,.35))}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

.strip{display:flex;flex-wrap:wrap;gap:3px;margin-top:14px}
.lsq{width:12px;height:12px;border:0;padding:0;background:var(--line-2);cursor:pointer;border-radius:3px}
.lsq.seen{background:#9BCDF2}
.lsq.mast{background:var(--acc)}
.lsq.due{background:#E8A33D}
.lsq.here{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--tx)}
.striplbl{margin-top:9px;font-size:12px;color:var(--fnt);font-weight:500}

/* panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);min-width:0}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;
  font-weight:600;color:var(--fnt);margin-bottom:12px}
.meta .ph{color:var(--acc-tx);background:var(--acc-soft);padding:3px 10px;border-radius:20px}
.say{font-size:20px;line-height:1.3;font-weight:600;letter-spacing:-.01em;min-height:52px}
.say .soft{color:var(--fnt);font-weight:500}
.note{background:var(--acc-soft);color:var(--acc-tx);border-radius:10px;padding:10px 13px;font-size:13px;
  font-weight:500;margin-top:12px}
.sheet{display:grid;grid-template-columns:24px 1fr 1fr;gap:2px 6px;font-family:var(--mono);font-size:13.5px;
  margin:16px 0 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  max-height:186px;overflow:auto;align-content:start}
.sheet .n{color:var(--fnt);font-size:12px;line-height:1.95}
.sheet .c{line-height:1.95;padding:0 6px;border-radius:6px;color:var(--tx)}
.sheet .c.theirs{color:var(--mut)}
.sheet .c.hid{background:var(--sunk);color:transparent}
.sheet .c.now{background:var(--acc);color:#fff}
.fb{font-size:13.5px;line-height:1.45;margin-top:12px;min-height:36px;color:var(--mut)}
.fb.err{color:var(--warn)}
.fb.ok{color:var(--acc-tx)}
.fb b{color:var(--tx);font-family:var(--mono);font-weight:500}
.acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center}
a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:7px}
a.btn.ext svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.pips{display:flex;gap:4px;align-items:center;margin-top:14px;font-size:12px;color:var(--fnt);font-weight:500}
.pip{width:8px;height:8px;border-radius:2px;background:var(--line-2)}
.pip.on{background:var(--acc)}
.keys{margin-top:10px;font-size:11px;color:var(--fnt);font-family:var(--mono)}

/* library */
.lede{max-width:52ch;margin-bottom:26px}
.lede h1{font-size:clamp(26px,4vw,38px);line-height:1.12;margin-bottom:12px}
.lede p{color:var(--mut);font-size:16px}
.reps{display:grid;gap:10px;margin-bottom:26px}
.rep{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:14px 16px;flex-wrap:wrap;box-shadow:var(--shadow)}
.rep .icon{width:40px;height:40px;background:var(--sunk);border-radius:11px;position:relative;flex:none}
.rep .nm{font-weight:700}
.rep .sub{font-size:12.5px;color:var(--fnt);font-weight:500;margin-top:1px}
.rep .grow{flex:1;min-width:160px}
.form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.form h2{font-size:17px;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.field{flex:1;min-width:170px}
.field label{display:block;font-size:12.5px;color:var(--mut);font-weight:600;margin-bottom:6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--sunk);color:var(--tx);
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-family:var(--ui);font-size:15px}
textarea{font-family:var(--mono);font-size:12.5px;line-height:1.6;min-height:140px;resize:vertical;white-space:pre}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc);background:var(--card)}
.drop{border:1.5px dashed var(--line-2);border-radius:14px;padding:18px;text-align:center;margin-bottom:14px;
  color:var(--mut);font-size:13.5px}
.drop.over{border-color:var(--acc);background:var(--acc-soft)}
.drop .btn{margin-bottom:8px}
.hint{font-size:12.5px;color:var(--fnt);margin-top:8px}
.banner{background:var(--acc-soft);border-radius:12px;padding:13px 15px;margin-bottom:14px;font-size:13.5px}
.banner.warn{background:rgba(216,80,60,.1)}
.banner h3{font-size:14px;margin-bottom:3px;color:var(--acc-tx)}
.banner.warn h3{color:var(--warn)}
.banner p{color:var(--mut);font-size:13px}
.banner ul{margin:7px 0 0;padding-left:18px;font-family:var(--mono);font-size:11.5px;color:var(--fnt)}
.bar{height:5px;background:var(--card);border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s linear}

/* lines */
.lines{display:grid;gap:8px}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 15px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;flex-wrap:wrap}
.lrow .n{font-family:var(--mono);font-size:12px;color:var(--fnt);width:24px}
.lrow .sans{flex:1;min-width:190px;font-family:var(--mono);font-size:12.5px;color:var(--mut);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .st{font-size:11.5px;color:var(--fnt);font-weight:600;width:80px}
.lrow.mast .st{color:var(--acc-tx)}
.lrow.due .st{color:#C1802A}
.lrow .miss{font-size:11.5px;font-weight:600;color:var(--warn);width:66px;text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;max-width:520px;box-shadow:var(--shadow)}
.card h2{font-size:21px;margin-bottom:8px}
.card p{color:var(--mut);margin-bottom:18px}

@media(max-width:960px){
  .stage{grid-template-columns:1fr;gap:18px}
  .bwrap{width:100%}
  .wrap{padding:12px 14px 44px}
  .say{font-size:18px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg id="sprite" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"></svg>
<div class="wrap">
  <div class="top">
    <button class="ico" id="mark" title="Repertoires" aria-label="Repertoires">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="title"><b id="markTitle">Repertoire Drill</b><small id="markSub">openings, one line at a time</small></div>
    <button class="ico" id="theme" title="Switch theme" aria-label="Switch theme">
      <svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
    </button>
  </div>

  <div class="subbar" id="subbar" hidden>
    <div class="seg" id="seg">
      <button data-mode="learn" aria-selected="true">Learn</button>
      <button data-mode="practice" aria-selected="false">Practice</button>
      <button data-mode="lines" aria-selected="false">All lines</button>
    </div>
    <div class="seg mini" id="sideSeg"></div>
    <span class="count" id="count"></span>
  </div>

  <section id="viewLibrary"></section>

  <section id="viewTrain" hidden>
    <div class="card" id="sessionDone" hidden></div>
    <div class="stage" id="stage">
      <div>
        <div class="boardcard" id="frame">
          <div class="bwrap">
            <div class="ranks" id="ranks"></div>
            <div class="board" id="board"></div>
            <div class="files" id="files"></div>
          </div>
        </div>
        <div class="strip" id="strip"></div>
        <div class="striplbl" id="stripLbl"></div>
      </div>
      <aside class="panel">
        <div class="meta"><span class="ph" id="phase"></span><span id="counter"></span></div>
        <p class="say" id="say"></p>
        <p class="note" id="note" hidden></p>
        <div class="sheet" id="sheet"></div>
        <div class="fb" id="fb"></div>
        <div class="acts" id="acts"></div>
        <div class="pips" id="pips"></div>
        <div class="keys">enter · continue &nbsp; h · hint &nbsp; r · restart</div>
      </aside>
    </div>
  </section>

  <section id="viewLines" hidden></section>
</div>

<script>
